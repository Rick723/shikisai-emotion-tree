name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4.11
        env:
          MYSQL_ROOT_PASSWORD: shikisai_ci_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --host=127.0.0.1 --user=root --password=shikisai_ci_password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      RAILS_ENV: test
      DB_HOST: 127.0.0.1
      MYSQL_ROOT_PASSWORD: shikisai_ci_password

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install MySQL build dependency
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes default-libmysqlclient-dev

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Run CI
        run: bin/ci
